<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تشكيلة</title>
<meta name="description" content="أداة المدرب: تقسيم الفرق، التدريب، المتابعة، والدوري">
<meta name="theme-color" content="#1B7A4B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:'Cairo';src:url(fonts/Cairo.ttf) format('truetype');font-weight:200 1000;font-display:swap}
@font-face{font-family:'Lalezar';src:url(fonts/Lalezar.ttf) format('truetype');font-weight:400;font-display:swap}
html{-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: coach's clipboard. Sticky tabs for الكبار / الصغار, wrapped section pills, cards per task, formation cards per bib colour, fixed bottom action bar on the split screen. */
:root{
  --bg:#F1F5F0; --surface:#FFFFFF; --surface-2:#E7EEE6; --ink:#12231A; --ink-2:#4B5E52; --line:#CFDACE;
  --accent:#1B7A4B; --accent-ink:#FFFFFF;
  --pitch:#DCEADB; --pitch-2:#D1E3D0; --pitch-line:#8FB293;
  --t1:#2158C9; --t2:#C2410C; --t3:#6D3FD0; --t4:#8F5B00; --on-team:#FFFFFF;
  --danger:#B3261E;
  --font-display:'Lalezar','Cairo',system-ui,sans-serif;
  --font-body:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1610; --surface:#15221A; --surface-2:#1D2D23; --ink:#E6F0E8; --ink-2:#9BB1A1; --line:#2B3E31;
    --accent:#4CC38A; --accent-ink:#052012;
    --pitch:#163122; --pitch-2:#132B1E; --pitch-line:#2F5C43;
    --t1:#7BA3FF; --t2:#FF9B66; --t3:#B99DFF; --t4:#F0C45C; --on-team:#0A140E;
    --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1610; --surface:#15221A; --surface-2:#1D2D23; --ink:#E6F0E8; --ink-2:#9BB1A1; --line:#2B3E31;
  --accent:#4CC38A; --accent-ink:#052012;
  --pitch:#163122; --pitch-2:#132B1E; --pitch-line:#2F5C43;
  --t1:#7BA3FF; --t2:#FF9B66; --t3:#B99DFF; --t4:#F0C45C; --on-team:#0A140E;
  --danger:#FF8A80; color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 12px}
.bright{display:flex;align-items:center;gap:8px}
.thm{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);padding:0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.2;color:var(--accent)}
.brand #today{font-size:13px;color:var(--ink-2)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.tab{display:flex;flex-direction:column;align-items:flex-start;text-align:start;min-height:56px;padding:6px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.tab .t1{font-family:var(--font-display);font-size:21px;line-height:1.3}
.tab .t1 small{font-family:var(--font-body);font-size:12px;font-weight:700;opacity:.8;margin-inline-start:4px}
.tab .t2{font-size:12px;color:var(--ink-2);line-height:1.3}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] .t2{color:var(--accent-ink);opacity:.9}

main .wrap{padding-block:16px 130px;display:flex;flex-direction:column;gap:16px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{min-height:40px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:14px;color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;min-height:44px;padding:0 14px;font-weight:700;color:var(--ink-2);border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2,.res-head h2{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.3}
.card h3.sub{font-size:15px;font-weight:700}
.cnt{display:inline-block;min-width:26px;padding:0 8px;margin-inline-start:6px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-family:var(--font-body);font-size:13px;font-weight:700;text-align:center}
.hint{font-size:13px;color:var(--ink-2)}
.row-between{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}

.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;min-height:48px;padding:0 20px;font-weight:700}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;font-weight:600}
.ghost[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.linkbtn{background:none;border:0;padding:4px 6px;min-height:32px;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}

.note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1.5px dashed var(--pitch-line);border-radius:14px;background:var(--pitch)}
.note p{font-size:14px;flex:1 1 220px}

/* attendance */
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.att{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;min-height:54px}
.att .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink-2);display:grid;place-items:center;color:transparent}
.att .nm{display:block;font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.att .meta{display:block;font-size:12px;color:var(--ink-2);line-height:1.3}
.att[aria-checked="true"]{border-color:var(--accent)}
.att[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.att[aria-checked="false"]{background:var(--surface-2)}
.att[aria-checked="false"] .nm{color:var(--ink-2);text-decoration:line-through}
.kline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kline .seg button{min-width:48px}
.focus{display:flex;flex-direction:column;gap:8px}
.fcs{display:flex;flex-direction:column;padding:8px 12px;border-radius:12px;background:var(--surface-2)}
.fcs b{font-size:15px}

/* result */
#result{scroll-margin-top:150px;display:flex;flex-direction:column;gap:12px}
.res-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.res-head .bal{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stale{padding:8px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;border:1px solid var(--line)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.team{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--tc);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.team header{display:flex;align-items:center;gap:8px}
.team h3{font-family:var(--font-display);font-weight:400;font-size:21px;line-height:1.3;color:var(--tc);flex:1}
.team .tsum{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bib{width:26px;height:26px;fill:var(--tc);flex:none}
.capline{display:flex;align-items:center;gap:6px;font-size:14px;min-height:32px}
.pitch{position:relative;border:2px solid var(--pitch-line);border-radius:10px;padding:12px 8px 14px;display:flex;flex-direction:column;gap:12px;background:repeating-linear-gradient(180deg,var(--pitch) 0 38px,var(--pitch-2) 38px 76px);overflow:hidden}
.pitch::after{content:"";position:absolute;inset:auto 24% 0 24%;height:44px;border:2px solid var(--pitch-line);border-bottom:0;border-radius:6px 6px 0 0;pointer-events:none}
.prow{position:relative;z-index:1;display:grid;grid-template-columns:42px 1fr;align-items:center;gap:6px}
.prow .lbl{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.prow .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pl{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:3px 11px;font-weight:700;font-size:14px;line-height:1.5}
.pl.cap{border-color:var(--tc);box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 30%,transparent)}
.pl .c{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--tc);color:var(--on-team);font-size:11px;font-weight:700}
.pl .lv{min-width:19px;padding:0 5px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:11.5px;text-align:center;font-variant-numeric:tabular-nums}
.mix{font-size:12.5px;color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.copybox{display:flex;flex-direction:column;gap:8px}
.copybox textarea{width:100%;min-height:200px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);line-height:1.6;resize:vertical}

/* players, forms */
.addf{display:grid;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.two{display:flex;flex-wrap:wrap;gap:12px}
.two .fld{flex:1 1 150px}
input[type="text"],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:110px}
details.dtl{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0}
details.dtl>summary{min-height:48px;padding:0 16px;display:flex;align-items:center;font-weight:700;cursor:pointer;color:var(--accent)}
details.dtl>.col{padding:0 16px 16px}
.col{display:flex;flex-direction:column;gap:10px;align-items:stretch}
details.bulk{border-top:1px solid var(--line);padding-top:10px}
details.bulk summary{min-height:40px;display:flex;align-items:center;font-weight:700;cursor:pointer;color:var(--accent)}
details.bulk[open] summary{margin-bottom:8px}
details.bulk .col{align-items:flex-start}
.plist{display:flex;flex-direction:column}
.pr{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr .sel{display:flex;flex-wrap:wrap;gap:8px;grid-column:1 / -1;align-items:center}
.pr select{flex:1 1 120px;width:auto}
.pr .seg button{min-width:42px;padding:0 6px}
.pr .full{grid-column:1 / -1;margin-top:-4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.del{border:1.5px solid var(--line);background:transparent;border-radius:10px;min-height:44px;padding:0 12px;color:var(--danger);font-weight:700}
.del.arm{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.openp{border:1.5px solid var(--line);background:transparent;border-radius:10px;min-height:44px;padding:0 12px;font-weight:700;color:var(--accent)}
.tag{display:inline-block;padding:0 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:700}
.tag.warn{background:color-mix(in srgb,var(--t2) 18%,var(--surface));color:var(--ink)}
.plist2{display:flex;flex-direction:column;gap:8px}
.plist2 li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.plist2 li:first-child{border-top:0}

/* rating */
.prog{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);border-radius:999px}
.card .rname{font-family:var(--font-display);font-weight:400;font-size:36px;line-height:1.25;overflow-wrap:anywhere}
.opts3,.opts4,.opts5{display:grid;gap:8px}
.opts3{grid-template-columns:repeat(3,1fr)}
.pl .spt{font-size:11px;font-weight:600;color:var(--ink-2)}
.opts4{grid-template-columns:repeat(4,1fr)}
.opts5{grid-template-columns:repeat(5,1fr)}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px;padding:4px 2px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;line-height:1.3}
.opt b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.opt small{font-size:11px;font-weight:600;color:var(--ink-2)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[aria-pressed="true"] small{color:var(--accent-ink)}

/* profile, follow-up */
.backrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2)}
.skills{display:flex;flex-wrap:wrap;gap:8px}
.sk{min-height:40px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600}
.sk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sk.dev[aria-pressed="true"]{background:color-mix(in srgb,var(--t2) 20%,var(--surface));border-color:var(--t2);color:var(--ink)}
.inl{display:flex;gap:8px}
.inl input{flex:1}
.spark{display:block;width:100%;max-width:340px;height:auto}
.spark .g{stroke:var(--line);stroke-width:1}
.spark .t{fill:var(--ink-2);font-size:9px}
.spark path{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--accent)}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.hist li:first-child{border-top:0}
.lrows{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:start;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;min-height:52px}
.lrow .nm{font-weight:700}
.lrow .pct{font-family:var(--font-display);font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.lrow .subl{grid-column:1 / -1;font-size:12.5px;color:var(--ink-2)}
.hb{display:flex;flex-direction:column;gap:4px}
.hb .top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.hb .track{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.hb .fill{height:100%;background:var(--t2);border-radius:999px}

/* league */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th,.tbl td{padding:8px 5px;text-align:center;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--ink-2);font-weight:700}
.tbl th:first-child,.tbl td:first-child{text-align:start;white-space:nowrap}
.tbl .pts{font-weight:700;color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc);margin-inline-end:6px}
.champ{padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:1.5px solid var(--accent);font-weight:700}
.rd{font-size:14px;font-weight:700;color:var(--ink-2);padding-top:4px}
.mt{display:grid;grid-template-columns:1fr 50px 12px 50px 1fr;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.mt .tn{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.mt .tn.aw{text-align:end}
.mt input.sc{text-align:center;padding:6px 2px;font-variant-numeric:tabular-nums}
.mt.done input.sc{border-color:var(--accent)}
.mt .vs{text-align:center;color:var(--ink-2)}
.trow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.trow .sw{width:14px;height:14px;border-radius:50%;background:var(--tc)}

.empty{text-align:center;padding:32px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-family:var(--font-display);font-weight:400;font-size:22px}
.empty p{color:var(--ink-2);max-width:34ch}
.foot{font-size:12.5px;color:var(--ink-2);text-align:center;padding-top:4px}

/* bottom bar */
.bar{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.cnt2{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:52px}
.cnt2 b{font-family:var(--font-display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums;color:var(--accent)}
.cnt2 span{font-size:12px;color:var(--ink-2)}
.go{flex:1;min-height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-size:23px;letter-spacing:.2px}
.toast{position:fixed;inset:auto 0 calc(92px + env(safe-area-inset-bottom,0px)) 0;z-index:40;display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
.toast span{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.toast.show span{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.toast span{transition:none}}
/* training + photos */
.av{border-radius:50%;object-fit:cover;background:var(--surface-2);flex:none;display:inline-grid;place-items:center;font-family:var(--font-display);color:var(--accent);font-size:26px;line-height:1}
.hrow{display:flex;align-items:center;gap:12px;min-width:0}
.hrow .rname{font-size:30px}
.clock{font-family:var(--font-display);font-size:60px;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--accent);direction:ltr;text-align:center}
.clock small{font-size:20px;font-family:var(--font-body)}
.alist{display:flex;flex-direction:column}
.ai{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ai:first-child{border-top:0}
.chk{width:40px;height:40px;border-radius:10px;border:2px solid var(--ink-2);background:transparent;display:grid;place-items:center;color:transparent;padding:0}
.ai.dn .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ai.dn .an b{text-decoration:line-through;color:var(--ink-2)}
.an{display:flex;flex-direction:column;min-width:0}
.an b{overflow-wrap:anywhere}
.aa{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}

  <header class="top">
    <div class="wrap">
      <div class="brand"><h1>تشكيلة</h1><div class="bright"><span id="today"></span><button class="thm" id="theme" data-act="theme" aria-label="تبديل الوضع الليلي"></button></div></div>
      <div class="tabs" id="tabs" role="tablist" aria-label="الفئة"></div>
    </div>
  </header>
  <main id="main"></main>
  <div class="bar" id="bar" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"><span></span></div>
</div>

<script>
(function(){
'use strict';
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','ar');

var POS=[{k:'GK',n:'حارس',g:'حارس'},{k:'DF',n:'مدافع',g:'دفاع'},{k:'MF',n:'وسط',g:'وسط'},{k:'FW',n:'مهاجم',g:'هجوم'}];
var LV=['','مبتدئ','ضعيف','متوسط','جيد','ممتاز'];
var CATS={A:{label:'الكبار'},B:{label:'الصغار'}};
var TEAMS=[{n:'الأزرق',dot:'🔵',v:'--t1'},{n:'البرتقالي',dot:'🟠',v:'--t2'},{n:'البنفسجي',dot:'🟣',v:'--t3'},{n:'الأصفر',dot:'🟡',v:'--t4'}];
var K_WORD={2:'فريقين',3:'ثلاثة فرق',4:'أربعة فرق'};
var SK0=['التمرير','استلام الكرة','التسديد','المراوغة','التمركز','الدفاع','السرعة','اللياقة','حراسة المرمى','الانضباط','روح الفريق'];
var VIEWS=['split','train','league','follow','rate','players','profile'];

var $=function(s){return document.querySelector(s)};
var ICON_MOON='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a.6.6 0 0 0-.8-.7A9.5 9.5 0 1 0 21.2 15a.6.6 0 0 0-.7-.8z"/></svg>';
var ICON_SUN='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>';
function isDark(){
  var t=document.documentElement.getAttribute('data-theme');
  if(t==='dark')return true;if(t==='light')return false;
  try{return window.matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}
}
function paintTheme(){var b=document.getElementById('theme');if(b){b.innerHTML=isDark()?ICON_SUN:ICON_MOON;b.title=isDark()?'الوضع النهاري':'الوضع الليلي'}}
(function(){
  try{var th=localStorage.getItem('tsh.theme');if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th)}catch(e){}
  paintTheme();
  try{new MutationObserver(paintTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
  try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme)}catch(e){}
})();
var main=$('#main'), bar=$('#bar'), app=$('#app');
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){return dkey(new Date())}
function parseKey(k){var a=k.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function daysBetween(a,b){return Math.round((parseKey(b)-parseKey(a))/86400000)}
function dateLabel(){try{return new Date().toLocaleDateString('ar-u-ca-gregory-nu-latn',{weekday:'long',day:'numeric',month:'long'})}catch(e){return ''}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function posName(k){return POS.filter(function(p){return p.k===k})[0].n}
function posGroup(k){return POS.filter(function(p){return p.k===k})[0].g}
var SP=[{k:'GK',n:'حارس',g:'GK'},{k:'RB',n:'ظهير أيمن',g:'DF'},{k:'CB',n:'قلب دفاع',g:'DF'},{k:'LB',n:'ظهير أيسر',g:'DF'},{k:'DM',n:'ارتكاز',g:'MF'},{k:'CM',n:'وسط',g:'MF'},{k:'AM',n:'صانع ألعاب',g:'MF'},{k:'RW',n:'جناح أيمن',g:'FW'},{k:'ST',n:'مهاجم',g:'FW'},{k:'LW',n:'جناح أيسر',g:'FW'}];
function spInfo(k){return SP.filter(function(x){return x.k===k})[0]}
function posCode(p){return p.sp||p.pos}
function setPos(p,code){var s=spInfo(code);if(s){p.sp=s.k;p.pos=s.g}else if(POS.some(function(x){return x.k===code})){p.pos=code;p.sp=''}}
function posLabel(p){var s=p.sp&&spInfo(p.sp);return s?s.n:posName(p.pos)}
function posNameAny(k){var s=spInfo(k);if(s)return s.n;return POS.some(function(x){return x.k===k})?posName(k):''}
function spOrd(p){var i=SP.map(function(x){return x.k}).indexOf(p.sp);return i<0?99:i}

/* ---------- data ---------- */
function mk(rows,teams){
  return {players:rows.map(function(r){return {id:uid(),name:r[0],pos:r[1],lvl:r[2],rated:true,present:true,cap:0}}),teams:teams||2,ex:true,presentDate:'',last:null};
}
function defaults(){
  return {v:2,skills:SK0.slice(),
    A:mk([['خالد','GK',4],['زياد','GK',2],['سالم','DF',4],['عمر','DF',3],['يوسف','DF',2],['علي','MF',5],['حسن','MF',4],['صالح','MF',3],['ياسر','FW',5],['بلال','FW',4],['أنس','FW',3],['فهد','FW',2]]),
    B:mk([['محمد','GK',3],['سعيد','GK',2],['أحمد','DF',4],['عبدالله','DF',3],['ماجد','DF',3],['إبراهيم','DF',2],['نواف','DF',1],['رائد','MF',5],['تميم','MF',4],['مازن','MF',4],['وليد','MF',3],['جابر','MF',3],['هادي','MF',2],['رامي','FW',5],['سامي','FW',4],['شادي','FW',3],['لؤي','FW',2],['طارق','FW',1]])
  };
}
function strArr(a){return Array.isArray(a)?a.map(String).filter(Boolean):[]}
function normalize(s){
  var t=todayKey();
  s.v=2;
  s.skills=strArr(s.skills);if(!s.skills.length)s.skills=SK0.slice();
  s.tpl=(Array.isArray(s.tpl)?s.tpl:[]).filter(function(t){return t&&t.id&&Array.isArray(t.acts)}).map(function(t){return {id:String(t.id),name:String(t.name||'قالب'),acts:t.acts.map(function(a){return {n:String(a.n||''),m:Math.min(180,Math.max(1,+a.m||10))}}).filter(function(a){return a.n})}});
  ['A','B'].forEach(function(c){
    var C=s[c]||(s[c]={});
    C.players=Array.isArray(C.players)?C.players:[];
    C.players.forEach(function(p){
      p.id=p.id||uid(); p.name=String(p.name||'بلا اسم');
      if(!POS.some(function(x){return x.k===p.pos}))p.pos='MF';
      var sq=spInfo(p.sp);if(!sq||sq.g!==p.pos)p.sp='';
      p.lvl=Math.min(5,Math.max(1,+p.lvl||3)); p.cap=+p.cap||0;
      p.rated=(p.rated===undefined)?true:!!p.rated; p.full=p.full?String(p.full):'';
      p.rd=p.rd?String(p.rd):'';p.img=p.img?String(p.img):'';
      p.rh=Array.isArray(p.rh)?p.rh.filter(function(e){return Array.isArray(e)&&e.length>=2}):[];
      p.str=strArr(p.str);p.dev=strArr(p.dev);p.note=p.note?String(p.note):'';p.watch=!!p.watch;
      p.present=(C.presentDate!==t)?true:(p.present!==false);
    });
    C.presentDate=t;
    C.teams=[2,3,4].indexOf(C.teams)>=0?C.teams:2;
    C.ex=!!C.ex;
    C.variety=(C.variety===undefined)?true:!!C.variety;
    C.pairs=Array.isArray(C.pairs)?C.pairs.filter(function(r){return r&&r.a&&r.b&&(r.t==='apart'||r.t==='together')}):[];
    if(!C.last||C.last.date!==t||!Array.isArray(C.last.teams))C.last=null;
  });
  return s;
}
function normLeague(L){
  if(!L||!Array.isArray(L.teams)||!Array.isArray(L.matches))return null;
  return L;
}

/* ---------- state ---------- */
var S=null,H={},P={},LG={A:null,B:null},db=null,ready=false,footErr=false;
var cat=(lsGet('tsh.cat')==='B')?'B':'A';
var v0=lsGet('tsh.view');
var view=(VIEWS.indexOf(v0)>=0&&v0!=='profile')?v0:'split';
var prevView='players',profId=null;
var showLv=lsGet('tsh.lv')==='1';
var newPos='CM',newLv=3,copyBox=null,pendingDel=null,delT=null,toastT=null,pairsOpen=false;
var rateIdx={A:0,B:0},draft={pos:null,lvl:null},lgRounds=1,lgArm=false,lgT=null;
var dirtyDocs={},saving=false,saveT=null;

function find(C,id){return C.players.filter(function(p){return p.id===id})[0]}
function present(C){return C.players.filter(function(p){return p.present})}

/* ---------- saving ---------- */
function touch(path){
  if(!ready)return;
  dirtyDocs[path||'app/roster']=true;
  clearTimeout(saveT);saveT=setTimeout(flush,600);
}
function docData(path){
  var p=path.split('/');
  if(p[0]==='app')return S;
  if(p[0]==='hist')return H[p[1]];
  if(p[0]==='plan')return P[p[1]];
  if(p[0]==='league')return LG[p[1]];
}
function persistLocal(){
  lsSet('tsh.data',JSON.stringify(S));lsSet('tsh.hist',JSON.stringify(H));lsSet('tsh.league',JSON.stringify(LG));lsSet('tsh.plan',JSON.stringify(P));
}
function flush(){
  if(saving)return;
  var paths=Object.keys(dirtyDocs);if(!paths.length)return;
  dirtyDocs={};saving=true;persistLocal();
  var chain=Promise.resolve();
  if(db){
    paths.forEach(function(path){
      chain=chain.then(function(){
        var d=docData(path);
        if(d===undefined)return;
        if(d===null)return db.doc(path).delete();
        return db.doc(path).set(JSON.parse(JSON.stringify(d)));
      });
    });
  }
  chain.then(function(){footErr=false}).catch(function(){footErr=true}).then(function(){
    saving=false;setFoot();
    if(Object.keys(dirtyDocs).length)saveT=setTimeout(flush,600);
  });
}
function footText(){
  if(!db)return 'محفوظ على هذا الجوال. احفظ نسخة احتياطية كل أسبوع من تبويب «اللاعبون».';
  if(footErr)return 'تعذّر الحفظ في حسابك الآن. البيانات محفوظة على هذا الجهاز.';
  return 'محفوظ في حسابك، ويظهر على أي جهاز تفتح منه الصفحة.';
}
function setFoot(){var f=$('#foot');if(f)f.textContent=footText()}
function toast(msg){
  var t=$('#toast');t.querySelector('span').textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2300);
}

/* ---------- history ---------- */
function mkey(c,d){return c+'_'+d.slice(0,7)}
function dayEntries(c){
  var out=[];
  Object.keys(H).forEach(function(k){
    if(k.indexOf(c+'_')!==0||!H[k]||!H[k].days)return;
    var ym=k.slice(2),days=H[k].days;
    Object.keys(days).forEach(function(dd){out.push({date:ym+'-'+dd,p:days[dd].p||[],t:days[dd].t||null})});
  });
  out.sort(function(a,b){return a.date<b.date?1:-1});
  return out;
}
function sessionsIn(c,n){
  var cut=dkey(new Date(Date.now()-n*86400000));
  return dayEntries(c).filter(function(e){return e.date>=cut});
}
function todayEntry(c){
  var t=todayKey(),h=H[mkey(c,t)];
  return h&&h.days?h.days[t.slice(8)]:null;
}
function sameSet(a,b){
  if(a.length!==b.length)return false;
  return a.every(function(x){return b.indexOf(x)>=0});
}
function recordDay(c){
  var C=S[c],t=todayKey(),k=mkey(c,t),dd=t.slice(8);
  H[k]=H[k]||{days:{}};
  var prev=H[k].days[dd],ids=present(C).map(function(p){return p.id});
  var fresh=C.last&&C.last.date===t&&sameSet(C.last.teams.reduce(function(s,x){return s.concat(x.ids)},[]),ids);
  H[k].days[dd]={p:ids,t:fresh?C.last.teams.map(function(x){return x.ids.slice()}):((prev&&prev.t)||null)};
  touch('hist/'+k);
}
function attStat(c,id,n){
  var ss=sessionsIn(c,n),P=0,streak=0,run=true,m3=false;
  ss.forEach(function(e){var pr=e.p.indexOf(id)>=0;if(pr)P++;if(run){if(pr)streak++;else run=false}});
  var l3=ss.slice(0,3);
  if(l3.length===3&&l3.every(function(e){return e.p.indexOf(id)<0}))m3=true;
  return {s:ss.length,p:P,streak:streak,rate:ss.length?P/ss.length:null,m3:m3};
}
function recentPairs(c,n){
  var m={},cnt=0;
  dayEntries(c).forEach(function(e){
    if(!e.t||cnt>=n)return;cnt++;
    e.t.forEach(function(ids){
      for(var i=0;i<ids.length;i++)for(var j=i+1;j<ids.length;j++){
        var key=ids[i]<ids[j]?ids[i]+'|'+ids[j]:ids[j]+'|'+ids[i];m[key]=(m[key]||0)+1;
      }
    });
  });
  return m;
}

/* ---------- ratings ---------- */
function needsRate(p){return !p.rated||(!!p.rd&&daysBetween(p.rd,todayKey())>30)}
function needList(C){return C.players.filter(needsRate)}
function firstNeed(C){for(var i=0;i<C.players.length;i++)if(needsRate(C.players[i]))return i;return -1}
function rateSet(p,lvl,pos){
  var t=todayKey();
  if(pos)setPos(p,pos);
  p.lvl=lvl;p.rated=true;p.rd=t;
  var last=p.rh[p.rh.length-1];
  if(last&&last[0]===t){last[1]=lvl;last[2]=posCode(p)}else p.rh.push([t,lvl,posCode(p)]);
  if(p.rh.length>40)p.rh=p.rh.slice(-40);
}
function trend(p){
  if(p.rh.length<2)return null;
  var a=p.rh[p.rh.length-2][1],b=p.rh[p.rh.length-1][1];
  return {from:a,to:b,d:b-a};
}

/* ---------- balancing ---------- */
//<<PART
function partition(P,k,opts){
  opts=opts||{};
  var n=P.length,base=Math.floor(n/k),extra=n%k,i,j,t;
  var sizes=[];for(i=0;i<k;i++)sizes.push(base+(i<extra?1:0));
  var total=0,hiTot=0,loTot=0,keys=['GK','DF','MF','FW'],posTot={GK:0,DF:0,MF:0,FW:0},idx={};
  P.forEach(function(p,z){total+=p.lvl;if(p.lvl>=4)hiTot++;if(p.lvl<=2)loTot++;posTot[p.pos]++;idx[p.id]=z});
  var W={GK:6,DF:2,MF:2,FW:2};
  var spKeys=['CB','RB','LB','DM','CM','AM','RW','LW','ST'],NS=spKeys.length,spTot=spKeys.map(function(){return 0});
  var spi=P.map(function(p){var q=spKeys.indexOf(p.sp);if(q>=0)spTot[q]++;return q});
  var apart=[],tog=[];
  (opts.apart||[]).forEach(function(r){if(idx[r[0]]!==undefined&&idx[r[1]]!==undefined)apart.push([idx[r[0]],idx[r[1]]])});
  (opts.together||[]).forEach(function(r){if(idx[r[0]]!==undefined&&idx[r[1]]!==undefined)tog.push([idx[r[0]],idx[r[1]]])});
  function cost(a){
    var Sm=[],H2=[],L=[],Cn={GK:[],DF:[],MF:[],FW:[]},x,q;
    for(x=0;x<k;x++){Sm.push(0);H2.push(0);L.push(0);keys.forEach(function(z){Cn[z].push(0)})}
    var Cs=new Array(k*NS).fill(0);
    for(x=0;x<n;x++){var tt=a[x],p=P[x];Sm[tt]+=p.lvl;if(p.lvl>=4)H2[tt]++;if(p.lvl<=2)L[tt]++;Cn[p.pos][tt]++;if(spi[x]>=0)Cs[tt*NS+spi[x]]++}
    var c=0;
    for(x=0;x<k;x++){
      var f=sizes[x]/n;
      c+=3*Math.pow(Sm[x]-total*f,2)+2*Math.pow(H2[x]-hiTot*f,2)+1.5*Math.pow(L[x]-loTot*f,2);
      for(q=0;q<4;q++){var key=keys[q];c+=W[key]*Math.pow(Cn[key][x]-posTot[key]*f,2)}
      for(q=0;q<NS;q++)if(spTot[q])c+=1.5*Math.pow(Cs[x*NS+q]-spTot[q]*f,2);
    }
    for(x=0;x<apart.length;x++)if(a[apart[x][0]]===a[apart[x][1]])c+=30;
    for(x=0;x<tog.length;x++)if(a[tog[x][0]]!==a[tog[x][1]])c+=30;
    return c;
  }
  var results=[];
  for(var r=0;r<60;r++){
    var ord=shuffle(Array.from({length:n},function(_,z){return z}));
    var a=new Array(n),c0=0;
    sizes.forEach(function(sz,tm){for(var m=0;m<sz;m++)a[ord[c0++]]=tm});
    var cur=cost(a),improved=true;
    while(improved){
      improved=false;
      for(i=0;i<n;i++)for(j=i+1;j<n;j++){
        if(a[i]===a[j])continue;
        t=a[i];a[i]=a[j];a[j]=t;
        var c2=cost(a);
        if(c2<cur-1e-9){cur=c2;improved=true}else{t=a[i];a[i]=a[j];a[j]=t}
      }
    }
    results.push({a:a.slice(),cost:cur});
  }
  results.sort(function(x,y){return x.cost-y.cost});
  var best=results[0].cost;
  var pool=results.filter(function(x){return x.cost<=best+0.6});
  var rec=opts.recent||null;
  if(rec){
    pool.forEach(function(x){
      var sc=0;
      for(i=0;i<n;i++)for(j=i+1;j<n;j++){
        if(x.a[i]!==x.a[j])continue;
        var key=P[i].id<P[j].id?P[i].id+'|'+P[j].id:P[j].id+'|'+P[i].id;
        sc+=rec[key]||0;
      }
      x.rep=sc;
    });
    var mn=Math.min.apply(null,pool.map(function(x){return x.rep}));
    pool=pool.filter(function(x){return x.rep===mn});
  }
  var pick=pool[Math.floor(Math.random()*pool.length)];
  var parts=[];for(i=0;i<k;i++)parts.push([]);
  P.forEach(function(p,z){parts[pick.a[z]].push(p.id)});
  return shuffle(parts);
}
//>>PART

function captainPool(C,ids,excludeId){
  var pl=ids.map(function(id){return find(C,id)}).filter(function(p){return p&&p.id!==excludeId});
  if(!pl.length)return [];
  var pool=pl.filter(function(p){return p.pos!=='GK'});if(!pool.length)pool=pl;
  var hi=pool.filter(function(p){return p.lvl>=3});if(hi.length)pool=hi;
  var min=Math.min.apply(null,pool.map(function(p){return p.cap||0}));
  return pool.filter(function(p){return (p.cap||0)===min});
}
function pickCaptain(C,ids,excludeId){
  var pool=captainPool(C,ids,excludeId);
  return pool.length?pool[Math.floor(Math.random()*pool.length)].id:null;
}
function undoApprove(C){
  C.last.teams.forEach(function(t){var p=find(C,t.cap);if(p&&p.cap>0)p.cap--});
  C.last.approved=false;
}

/* ---------- actions ---------- */
function split(){
  var C=S[cat],P=present(C),k=C.teams;
  if(P.length<k){toast('عدد الحاضرين أقل من عدد الفرق');return}
  if(C.last&&C.last.approved)undoApprove(C);
  var opts={apart:[],together:[],recent:C.variety?recentPairs(cat,6):null};
  C.pairs.forEach(function(r){(r.t==='apart'?opts.apart:opts.together).push([r.a,r.b])});
  var parts=partition(P,k,opts);
  C.last={date:todayKey(),k:k,teams:parts.map(function(ids){return {ids:ids,cap:pickCaptain(C,ids)}}),approved:false};
  copyBox=null;touch();recordDay(cat);render();
  var el=$('#result');

function makeSchedule(teams,rounds){
  var arr=teams.map(function(t){return t.id});
  if(arr.length%2)arr.push(null);
  var n=arr.length,half=n/2,list=[],r,i;
  for(r=0;r<n-1;r++){
    for(i=0;i<half;i++){
      var a=arr[i],b=arr[n-1-i];
      if(a&&b){
        var h=(r%2===0)?a:b,w=(r%2===0)?b:a;
        list.push({id:'m'+list.length,r:r+1,h:h,a:w,hs:null,as:null,done:false});
      }
    }
    arr.splice(1,0,arr.pop());
  }
  if(rounds===2){
    var n0=list.length;
    for(i=0;i<n0;i++){var m=list[i];list.push({id:'m'+list.length,r:m.r+(n-1),h:m.a,a:m.h,hs:null,as:null,done:false})}
  }
  return list;
}
function standings(L){
  var m={};
  L.teams.forEach(function(t){m[t.id]={t:t,pl:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}});
  L.matches.forEach(function(x){
    if(!x.done||!m[x.h]||!m[x.a])return;
    var h=m[x.h],a=m[x.a];
    h.pl++;a.pl++;h.gf+=x.hs;h.ga+=x.as;a.gf+=x.as;a.ga+=x.hs;
    if(x.hs>x.as){h.w++;a.l++;h.pts+=3}else if(x.hs<x.as){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}
  });
  return Object.keys(m).map(function(k){return m[k]}).sort(function(x,y){return y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf});
}

      if(x){x.done=!x.done;if(x.done&&d.cur&&d.cur.id===id)d.cur=null;planTouch();render()}
      break;
    case 'actdel':d=planDay(cat,true);d.acts=d.acts.filter(function(z){return z.id!==id});if(d.cur&&d.cur.id===id)d.cur=null;planTouch();render();break;
    case 'actgo':
      d=planDay(cat,true);x=d.acts.filter(function(z){return z.id===id})[0];if(!x)break;
      if(!d.s){d.s=Date.now();d.e=0;holdScreen(true)}
      d.cur={id:id,end:Date.now()+x.m*60000,fired:false};unlockAudio();planTouch();render();break;
    case 'actstop':d=planDay(cat,true);d.cur=null;planTouch();render();break;
    case 'quickadd':
      x=devCounts(present(C))[+b.dataset.i];if(x){addAct('تدريب على: '+x.s,10);render();toast('أُضيف النشاط')}
      break;
    case 'tplsave':
      d=planDay(cat,false);var nm=$('#tplname'),name=nm?nm.value.trim():'';
      if(!d||!d.acts.length)break;
      if(!name){if(nm)nm.focus();toast('اكتب اسمًا للقالب');break}
      S.tpl=S.tpl||[];S.tpl.push({id:uid(),name:name,acts:d.acts.map(function(z){return {n:z.n,m:z.m}})});
      touch();render();toast('حُفظ القالب');break;
    case 'tplload':
      x=(S.tpl||[]).filter(function(z){return z.id===id})[0];
      if(x){x.acts.forEach(function(z){addAct(z.n,z.m)});render();toast('أُضيفت أنشطة القالب')}
      break;
    case 'tpldel':
      if(pendingDel==='tpl'+id){S.tpl=S.tpl.filter(function(z){return z.id!==id});pendingDel=null;touch();render()}
      else{pendingDel='tpl'+id;b.textContent='تأكيد';clearTimeout(delT);delT=setTimeout(function(){pendingDel=null;b.textContent='حذف'},3500)}
      break;
    case 'bksave':makeBackup();break;
    case 'impok':applyImport();break;
    case 'impno':pendingImport=null;render();break;
    case 'gobackup':setView('players');setTimeout(function(){var e=$('#backup');if(e)e.scrollIntoView({block:'start'})},60);break;
    case 'expt':exp[b.dataset.k]=!exp[b.dataset.k];clearPrev();render();break;
    case 'expprev':
      p0().then(function(bl){if(!bl)return;clearPrev();prevUrl=URL.createObjectURL(bl);render()});break;
    case 'expsave':
      if(!DL||busy)break;
      var pp=find(C,profId);if(!pp)break;
      busy=true;toast('جارٍ تجهيز البطاقة…');
      renderCard(pp,exp).then(function(bl){
        if(!bl)throw {code:'x'};
        return DL.save({filename:String(pp.name).replace(/[\\\/:*?"<>|]/g,' ').trim()+' - بطاقة لاعب.png',data:bl});
      }).then(function(){toast('تم حفظ البطاقة')}).catch(function(err){toast(err&&err.code==='declined'?'أُلغي الحفظ':'تعذّر حفظ البطاقة')}).then(function(){busy=false});
      break;
    case 'exptxt':
      var p2=find(C,profId);if(!p2)break;
      var txt=buildPlayerText(p2,exp);
      var fail=function(){copyBox=txt;render()};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('تم النسخ')}).catch(fail);else fail();
      break;
    case 'photodel':
      var p3=find(C,profId);if(!p3||!p3.img)break;
      if(photoArm){
        var old=p3.img;p3.img='';photoArm=false;touch();clearPrev();
        if(ASSETS){try{ASSETS.delete(old).catch(function(){})}catch(e){}}
        render();toast('حُذفت الصورة');
      }else{photoArm=true;b.textContent='اضغط مرة أخرى للتأكيد';setTimeout(function(){photoArm=false;if(b.isConnected)b.textContent='احذف الصورة'},3500)}
      break;
  }
}

function buildPlayerText(p,o){
  var s=starCount(cat,p.id,30),a=attStat(cat,p.id,30),tr=trend(p),L=['⚽ بطاقة لاعب — '+p.name,CATS[cat].label+' · '+posLabel(p)];
  if(o.lvl)L.push('المستوى: '+(p.rated?LV[p.lvl]+' ('+p.lvl+' من 5)':'غير مقيَّم'));
  if(o.hist&&tr)L.push('التطور: '+(tr.d>0?'تحسّن':tr.d<0?'انخفض':'ثابت')+' من '+tr.from+' إلى '+tr.to);
  if(o.att&&a.rate!==null)L.push('الحضور (30 يومًا): '+Math.round(a.rate*100)+'% — حضر '+a.p+' من '+a.s);
  if(o.stars)L.push('النجوم (30 يومًا): الأداء '+s.perf+' · الالتزام '+s.spirit);
  if(o.skills&&p.str.length)L.push('نقاط القوة: '+p.str.join('، '));
  if(o.skills&&p.dev.length)L.push('يحتاج تطوير: '+p.dev.join('، '));
  if(o.notes&&p.note)L.push('ملاحظة المدرب: '+p.note);
  L.push(dateLabel());
  return L.join('\n');
}
function setPhoto(file){
  var p=find(S[cat],profId);if(!file||!p||!ASSETS)return;
  toast('جارٍ تجهيز الصورة…');
  var fr=new FileReader();
  fr.onerror=function(){toast('تعذّرت قراءة الملف')};
  fr.onload=function(){
    var im=new Image();
    im.onerror=function(){toast('الملف ليس صورة صالحة')};
    im.onload=function(){
      var s=Math.min(im.naturalWidth,im.naturalHeight),out=Math.min(720,s),cv=document.createElement('canvas');
      cv.width=cv.height=out;
      cv.getContext('2d').drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)*0.3,s,s,0,0,out,out);
      cv.toBlob(function(bl){
        if(!bl){toast('تعذّرت قراءة الصورة');return}
        ASSETS.upload(bl,{type:'image/jpeg'}).then(function(r){
          var old=p.img;p.img=r.id;touch();clearPrev();
          if(old){try{ASSETS.delete(old).catch(function(){})}catch(e){}}
          if(view==='profile'&&profId===p.id)render();
          toast('تم حفظ الصورة');
        }).catch(function(err){toast(err&&err.code==='quota_or_state'?'امتلأت مساحة الصور':'تعذّر رفع الصورة')});
      },'image/jpeg',0.86);
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- player card (canvas) ---------- */
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrapLines(ctx,text,maxW){
  var out=[];
  String(text).split('\n').forEach(function(par){
    var words=par.split(/\s+/).filter(Boolean),cur='';
    if(!words.length){out.push('');return}
    words.forEach(function(w){
      var t=cur?cur+' '+w:w;
      if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t;
    });
    if(cur)out.push(cur);
  });
  return out;
}
function loadImg(url){
  return new Promise(function(res){var im=new Image();im.onload=function(){res(im)};im.onerror=function(){res(null)};im.src=url});
}
function fontsReady(){
  try{if(document.fonts&&document.fonts.load)return Promise.all([document.fonts.load('400 28px Cairo','أبت'),document.fonts.load('700 28px Cairo','أبت'),document.fonts.load('600 28px Cairo','أبت')]).catch(function(){})}catch(e){}
  return Promise.resolve();
}
function paintCard(ctx,dry,d){
  var W=1080,M=60,R=W-M,CW=W-2*M,p=d.p,o=d.o,y=0;
  function F(sz,wt){ctx.font=(wt||400)+' '+sz+'px Cairo,Tahoma,"Segoe UI",sans-serif'}
  function T(t,x,yy){if(!dry)ctx.fillText(t,x,yy)}
  function fit(t,sz,wt,maxW){F(sz,wt);while(sz>24&&ctx.measureText(t).width>maxW){sz-=2;F(sz,wt)}return sz}
  ctx.direction='rtl';ctx.textAlign='right';ctx.textBaseline='alphabetic';
  if(!dry){ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,d.H)}
  var HH=o.photo?300:220;
  if(!dry){
    ctx.fillStyle='#1B7A4B';ctx.fillRect(0,0,W,HH);
    ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(70,HH-10,130,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,HH-10);ctx.lineTo(220,HH-10);ctx.stroke();
  }
  var tx=R;
  if(o.photo){
    var cx=R-110,cy=HH/2,r=104;
    if(!dry){
      ctx.save();
      ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(cx,cy,r+8,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
      if(d.img){var iw=d.img.naturalWidth,ih=d.img.naturalHeight,s=Math.min(iw,ih);ctx.drawImage(d.img,(iw-s)/2,(ih-s)*0.3,s,s,cx-r,cy-r,2*r,2*r)}
      else{ctx.fillStyle='#E7EEE6';ctx.fillRect(cx-r,cy-r,2*r,2*r);ctx.fillStyle='#1B7A4B';ctx.textAlign='center';F(96,700);ctx.fillText(String(p.name||'?').charAt(0),cx,cy+32)}
      ctx.restore();
    }
    tx=R-240;
  }
  ctx.textAlign='right';
  ctx.fillStyle='rgba(255,255,255,0.85)';F(26,600);T('بطاقة لاعب · '+CATS[cat].label,tx,HH/2-50);
  ctx.fillStyle='#FFFFFF';fit(p.name,66,700,tx-M);T(p.name,tx,HH/2+22);
  var sub=posLabel(p)+(p.full&&p.full!==p.name?' · '+p.full:'');
  ctx.fillStyle='rgba(255,255,255,0.92)';fit(sub,30,600,tx-M);T(sub,tx,HH/2+72);
  y=HH+44;
  function tiles(arr){
    var n=arr.length,gap=20,tw=(CW-(n-1)*gap)/n;
    arr.forEach(function(t,i){
      var x=R-(i+1)*tw-i*gap;
      if(!dry){ctx.fillStyle='#E7EEE6';rr(ctx,x,y,tw,138,24);ctx.fill()}
      ctx.textAlign='center';ctx.fillStyle='#12231A';fit(t[1],44,700,tw-24);T(t[1],x+tw/2,y+68);
      ctx.fillStyle='#4B5E52';fit(t[0],24,600,tw-20);T(t[0],x+tw/2,y+112);
    });
    ctx.textAlign='right';y+=138+36;
  }
  function title(t){ctx.textAlign='right';ctx.fillStyle='#1B7A4B';F(34,700);T(t,R,y+30);y+=58}
  function chips(list,bg){
    F(28,600);var x=R;
    list.forEach(function(s){
      var w=ctx.measureText(s).width+48;
      if(x!==R&&x-w<M){x=R;y+=64}
      if(!dry){ctx.fillStyle=bg;rr(ctx,x-w,y,w,52,26);ctx.fill();ctx.fillStyle='#12231A';ctx.textAlign='center';ctx.fillText(s,x-w/2,y+36);ctx.textAlign='right'}
      x-=w+14;
    });
    y+=64+14;
  }
  var t1=[];
  if(o.lvl){t1.push(['المستوى',p.rated?LV[p.lvl]+' · '+p.lvl:'غير مقيَّم']);t1.push(['المركز',posLabel(p)])}
  if(o.att)t1.push(['الحضور · 30 يومًا',d.st.rate===null?'—':Math.round(d.st.rate*100)+'%']);
  if(t1.length)tiles(t1);
  if(o.hist&&p.rh.length>=2){
    title('تطور المستوى');
    var pts=p.rh.slice(-8),n=pts.length,ch=150,y0=y+34,x0=R-30,x1=M+30;
    if(!dry){
      ctx.strokeStyle='#CFDACE';ctx.lineWidth=2;
      [1,3,5].forEach(function(l){var gy=y0+ch-(l-1)*ch/4;ctx.beginPath();ctx.moveTo(M,gy);ctx.lineTo(R,gy);ctx.stroke()});
      ctx.strokeStyle='#1B7A4B';ctx.lineWidth=6;ctx.lineJoin='round';ctx.beginPath();
      pts.forEach(function(e,i){var px=x0-i*(x0-x1)/(n-1),py=y0+ch-(e[1]-1)*ch/4;if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py)});
      ctx.stroke();
      ctx.textAlign='center';F(26,700);
      pts.forEach(function(e,i){var px=x0-i*(x0-x1)/(n-1),py=y0+ch-(e[1]-1)*ch/4;ctx.fillStyle='#1B7A4B';ctx.beginPath();ctx.arc(px,py,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#12231A';ctx.fillText(String(e[1]),px,py-16)});
      ctx.textAlign='right';
    }
    y=y0+ch+36;
  }
  if(o.stars)tiles([['الأفضل أداءً · 30 يومًا','★ '+d.stars.perf],['الأكثر التزامًا · 30 يومًا','★ '+d.stars.spirit]]);
  if(o.skills&&p.str.length){title('نقاط القوة');chips(p.str,'#DDEFE3');y+=8}
  if(o.skills&&p.dev.length){title('يحتاج تطوير');chips(p.dev,'#FBE3D2');y+=8}
  if(o.notes&&p.note){
    title('ملاحظة المدرب');F(30,400);ctx.fillStyle='#12231A';ctx.textAlign='right';
    wrapLines(ctx,p.note,CW).forEach(function(l){T(l,R,y+30);y+=48});y+=16;
  }
  if(!dry){ctx.fillStyle='#CFDACE';ctx.fillRect(M,y,CW,2)}
  y+=46;ctx.textAlign='center';ctx.fillStyle='#4B5E52';F(24,600);T('تشكيلة · '+dateLabel(),W/2,y);y+=48;
  return Math.ceil(y);
}
function renderCard(p,o){
  return Promise.all([(o.photo&&PHOTO.url(p.img))?loadImg(PHOTO.url(p.img)):Promise.resolve(null),fontsReady()]).then(function(r){
    var d={p:p,o:o,img:r[0],st:attStat(cat,p.id,30),stars:starCount(cat,p.id,30)};
    var cv=document.createElement('canvas');cv.width=1080;cv.height=10;
    var H=paintCard(cv.getContext('2d'),true,d);
    cv.height=H;d.H=H;
    paintCard(cv.getContext('2d'),false,d);
    return new Promise(function(res){cv.toBlob(res,'image/png')});
  });
}

/* ---------- local device storage (installed app) ---------- */
var PHOTO=(function(){
  var dbp=null,urls={};
  function idb(){
    if(dbp)return dbp;
    dbp=new Promise(function(res,rej){
      try{var r=indexedDB.open('tashkeela',1);
        r.onupgradeneeded=function(){r.result.createObjectStore('photos')};
        r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
      }catch(e){rej(e)}
    });
    return dbp;
  }
  function run(mode,fn){
    return idb().then(function(d){return new Promise(function(res,rej){
      var t=d.transaction('photos',mode),out=fn(t.objectStore('photos'));
      t.oncomplete=function(){res(out&&out.result)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)};
    })});
  }
  return {
    url:function(id){return (id&&urls[id])||''},
    loadAll:function(){
      return idb().then(function(d){return new Promise(function(res){
        var c=d.transaction('photos').objectStore('photos').openCursor();
        c.onsuccess=function(){var k=c.result;if(k){urls[k.key]=URL.createObjectURL(k.value);k.continue()}else res()};
        c.onerror=function(){res()};
      })}).catch(function(){});
    },
    put:function(id,blob){
      return run('readwrite',function(s){s.put(blob,id)}).then(function(){
        if(urls[id])URL.revokeObjectURL(urls[id]);urls[id]=URL.createObjectURL(blob);return id;
      });
    },
    del:function(id){
      return run('readwrite',function(s){s.delete(id)}).then(function(){if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id]}});
    },
    clear:function(){
      return run('readwrite',function(s){s.clear()}).then(function(){Object.keys(urls).forEach(function(k){URL.revokeObjectURL(urls[k])});urls={}});
    },
    entries:function(){
      return idb().then(function(d){return new Promise(function(res){
        var out=[],c=d.transaction('photos').objectStore('photos').openCursor();
        c.onsuccess=function(){var k=c.result;if(k){out.push([k.key,k.value]);k.continue()}else res(out)};
        c.onerror=function(){res(out)};
      })});
    }
  };
})();
var LOCAL_ASSETS={
  upload:function(bl){var id='ph'+Date.now().toString(36)+uid();return PHOTO.put(id,bl).then(function(){return {id:id,url:PHOTO.url(id)}})},

    function dl(){

function sparkSVG(rh){
  var pts=rh.slice(-10);if(pts.length<2)return '';
  var w=220,h=64,px=18,py=10,n=pts.length,st=(w-2*px)/(n-1);
  var xy=pts.map(function(e,i){return [w-px-i*st,h-py-(e[1]-1)*(h-2*py)/4]});
  var path=xy.map(function(q,i){return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join(' ');
  var grid=[1,3,5].map(function(l){var y=h-py-(l-1)*(h-2*py)/4;return '<line class="g" x1="'+px+'" x2="'+(w-px)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="t" x="'+(w-2)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+l+'</text>'}).join('');
  var last=xy[n-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="تطور المستوى من '+pts[0][1]+' إلى '+pts[n-1][1]+'">'+grid+'<path d="'+path+'"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.6"/></svg>';
}

  try{var l0=JSON.parse(lsGet('tsh.league')||'{}');LG={A:normLeague(l0.A),B:normLeague(l0.B)}}catch(err){LG={A:null,B:null}}
  try{var p0x=JSON.parse(lsGet('tsh.plan')||'{}');if(p0x&&typeof p0x==='object')P=p0x}catch(err){P={}}
  function go(){ready=true;if(view==='rate')enterRate();render()}
  ASSETS=LOCAL_ASSETS;DL=LOCAL_DL;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(!window.claude||!window.claude.use){PHOTO.loadAll().then(go,go);return}
  render();
  window.claude.use('assets').then(function(a){ASSETS=a;if(view==='profile')render()}).catch(function(){});
  window.claude.use('downloads').then(function(a){DL=a;if(view==='profile')render()}).catch(function(){});
  window.claude.use('db').then(function(d){
    db=d;
    if(!d){go();return}
    var tasks=[
      d.doc('app/roster').get().then(function(snap){if(snap.exists)S=normalize(JSON.parse(JSON.stringify(snap.data())))}),
      d.collection('hist').get().then(function(qs){qs.docs.forEach(function(x){if(x.exists)H[x.id]=JSON.parse(JSON.stringify(x.data()))})}),
      d.collection('plan').get().then(function(qs){qs.docs.forEach(function(x){if(x.exists)P[x.id]=JSON.parse(JSON.stringify(x.data()))})}),
      d.doc('league/A').get().then(function(s){if(s.exists)LG.A=normLeague(JSON.parse(JSON.stringify(s.data())))}),
      d.doc('league/B').get().then(function(s){if(s.exists)LG.B=normLeague(JSON.parse(JSON.stringify(s.data())))})
    ];
    return Promise.all(tasks.map(function(t){return t.catch(function(){footErr=true})})).then(go);
  }).catch(function(){db=null;go()});
})();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
